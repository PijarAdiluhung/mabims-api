name: Purge Bunny CDN

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge API zone
        run: >
          curl -sS --fail --retry 5 --retry-delay 2 --retry-all-errors -X POST
          "https://api.bunny.net/pullzone/${{ secrets.BUNNY_API_ZONE_API }}/purgeCache"
          -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}"

      - name: Purge Docs zone
        run: >
          curl -sS --fail --retry 5 --retry-delay 2 --retry-all-errors -X POST
          "https://api.bunny.net/pullzone/${{ secrets.BUNNY_API_ZONE_DOCS }}/purgeCache"
          -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}"
