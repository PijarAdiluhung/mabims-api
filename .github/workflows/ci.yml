name: Prod monitor

# The deploy gates (pytest + ruff + ephemeris probe) run INSIDE the Dokploy
# image build — see api/Dockerfile (test stage). A red suite fails the build
# and the deploy never starts. This workflow is the second line of defense:
# it waits for the pushed build to actually go live (build_hash diff — the
# file hash is now content-derived, so it changes exactly when new code
# ships), purges the CDN so the edge re-populates from the new build, then
# verifies the live endpoints. It cannot deploy, recover or revert anything.

on:
  push:
    branches: [main]

# One run per branch at a time; a newer push makes the superseded run moot.
concurrency:
  group: monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    steps:
      - name: Record the current live build hash
        run: |
          set -euo pipefail
          BODY=$(curl -sf --max-time 15 "https://api.mabims.dev/healthz" || true)
          OLD=$(printf '%s' "$BODY" | jq -r '.build_hash // "unknown"' 2>/dev/null || echo unknown)
          echo "OLD_BUILD_HASH=$OLD" >> "$GITHUB_ENV"
          echo "pre-deploy build_hash=$OLD"

      # Empty the edge first so nothing served by the monitor can come from
      # the old build's cache entries.
      - name: Purge API CDN zone (pre-checks)
        run: >
          curl -sS --fail --retry 5 --retry-delay 5 --retry-all-errors
          --connect-timeout 15 --max-time 60 -X POST
          "https://api.bunny.net/pullzone/${{ secrets.BUNNY_API_ZONE_API }}/purgeCache"
          -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}"

      - name: Purge Docs CDN zone (pre-checks)
        run: >
          curl -sS --fail --retry 5 --retry-delay 5 --retry-all-errors
          --connect-timeout 15 --max-time 60 -X POST
          "https://api.bunny.net/pullzone/${{ secrets.BUNNY_API_ZONE_DOCS }}/purgeCache"
          -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}"

      # Wait until the container that came from THIS push is actually serving.
      # The green-before-build-finished failure mode: the checks below are
      # honest only against the new origin. /healthz is no-store, so this
      # always reaches origin.
      - name: Wait for the new build hash to go live
        run: |
          set -euo pipefail
          OLD="$OLD_BUILD_HASH"
          if [ "$OLD" = "unknown" ] || [ "$OLD" = "null" ]; then
            echo "no pre-deploy hash; giving the deploy a 5m window before checks"
            sleep 300
            exit 0
          fi
          echo "40s grace for the build to start..."
          sleep 40
          # Cold builds with downloads get the full 15m; content-derived hash
          # means unchanged api content legitimately keeps the old hash.
          for i in $(seq 1 60); do
            BODY=$(curl -sf --max-time 15 "https://api.mabims.dev/healthz" || true)
            HASH=$(printf '%s' "$BODY" | jq -r '.build_hash // "unknown"' 2>/dev/null || echo unknown)
            if [ "$HASH" != "$OLD" ]; then
              echo "new build live after $((40 + i * 15))s: $HASH"
              exit 0
            fi
            echo "Attempt $i/60: still serving build_hash=$OLD"
            sleep 15
          done
          # No api-content change => cached image => no new hash to wait for.
          echo "WARN: build_hash unchanged after 15m (api content unchanged?); proceeding to checks"

      # The edge needs one more purge AFTER the new build goes live, so real
      # clients re-populate from the new container instead of stale entries.
      - name: Purge API CDN zone (post-deploy)
        run: >
          curl -sS --fail --retry 5 --retry-delay 5 --retry-all-errors
          --connect-timeout 15 --max-time 60 -X POST
          "https://api.bunny.net/pullzone/${{ secrets.BUNNY_API_ZONE_API }}/purgeCache"
          -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}"

      - name: Purge Docs CDN zone (post-deploy)
        run: >
          curl -sS --fail --retry 5 --retry-delay 5 --retry-all-errors
          --connect-timeout 15 --max-time 60 -X POST
          "https://api.bunny.net/pullzone/${{ secrets.BUNNY_API_ZONE_DOCS }}/purgeCache"
          -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}"

      # The /hilal pipeline (ephemeris + astro cache + site model) is the part
      # that has failed in production while everything else stayed green, so
      # it is the sentinel: month=9&year=1447 is a curated-table month whose
      # answer is stable forever.
      - name: Verify the live hilal endpoint
        run: |
          # Fresh boots also render/populate caches lazily — 30 x 15s = 450s.
          MAX_ATTEMPTS=30
          for i in $(seq 1 $MAX_ATTEMPTS); do
            CB=$(date +%s)
            BODY=$(curl -sS -w '\n%{http_code}' \
              "https://api.mabims.dev/api/v1/hilal/info?month=9&year=1447&cb=$CB" || true)
            CODE=$(echo "$BODY" | tail -n1)
            if [ "$CODE" = "200" ]; then
              echo "hilal/info healthy: $(echo "$BODY" | head -n1 | head -c 200)"
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE $(echo "$BODY" | head -n1 | head -c 400)"
            sleep 15
          done
          echo "ERROR: /api/v1/hilal/info is not healthy on the live deployment"
          exit 1

      # Core endpoints as a sanity sweep after the heavy sentinel.
      - name: Verify core endpoints
        run: |
          set -euo pipefail
          CB=$(date +%s)
          for EP in "v1/today?tz=Asia/Jakarta" "v1/convert?date=2025-01-03&calendar=gregorian" "v1/meta"; do
            case "$EP" in *"?"*) SEP="&" ;; *) SEP="?" ;; esac
            for i in 1 2 3 4 5 6 7 8; do
              CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
                "https://api.mabims.dev/api/${EP}${SEP}cb=$CB" || true)
              if [ "$CODE" = "200" ]; then
                echo "OK /api/${EP}"
                break
              fi
              echo "Attempt $i: /api/${EP} -> $CODE"
              sleep 15
              if [ "$i" -eq 8 ]; then
                echo "ERROR: /api/${EP} unhealthy on the live deployment"
                exit 1
              fi
            done
          done
