name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch/PR at a time: new pushes cancel the superseded run
# instead of stacking runners and racing for the same caches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    env:
      MABIMS_EPHEMERIS_DIR: ${{ github.workspace }}/api/.ephem
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Restore JPL ephemeris (de440s.bsp)
        id: ephemeris-cache
        uses: actions/cache@v5
        with:
          path: api/.ephem
          key: ${{ runner.os }}-de440s.bsp-v1

      - name: Download JPL ephemeris on cache miss
        if: steps.ephemeris-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .ephem
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 15 --max-time 300 \
            https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de440s.bsp \
            --output .ephem/de440s.bsp
          test -s .ephem/de440s.bsp

      - name: Install package + dev tools
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest -q

      - name: Validate curated table vs Neo MABIMS criteria
        run: python scripts/validate_mabims.py

  lockfile-linux:
    # Docs images build on node:22-alpine, but lockfiles are regenerated on
    # Windows dev machines. npm's platform-optional resolution can leave a
    # linux-only subtree missing from a Windows-generated lock, which only
    # surfaces as EUSAGE inside the container build. Recreate the Dockerfile's
    # npm ci here so the drift fails in CI instead of at deploy time.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate docs lockfile against node:22-alpine resolution
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE/docs:/app" -w /app
          node:22-alpine sh -c "npm ci --no-fund --no-audit --dry-run"

  deploy-and-purge:
    runs-on: ubuntu-latest
    needs: ci
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Poll origin for new deploy
        run: |
          MAX_ATTEMPTS=30
          SLEEP=10
          for i in $(seq 1 $MAX_ATTEMPTS); do
            BODY=$(curl -sf "https://api.mabims.dev/healthz" || true)
            HASH=$(echo "$BODY" | jq -r .build_hash)
            if [ -n "$HASH" ] && [ "$HASH" != "null" ] && [ "$HASH" != "unknown" ]; then
              echo "Deploy confirmed: build_hash=$HASH"
              exit 0
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: build_hash='$HASH', waiting..."
            sleep $SLEEP
          done
          echo "ERROR: Deploy did not go live within $((MAX_ATTEMPTS * SLEEP))s"
          exit 1

      - name: Purge API CDN zone
        run: >
          curl -sS --fail --retry 5 --retry-delay 2 --retry-all-errors -X POST
          "https://api.bunny.net/pullzone/${{ secrets.BUNNY_API_ZONE_API }}/purgeCache"
          -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}"

      - name: Purge Docs CDN zone
        run: >
          curl -sS --fail --retry 5 --retry-delay 2 --retry-all-errors -X POST
          "https://api.bunny.net/pullzone/${{ secrets.BUNNY_API_ZONE_DOCS }}/purgeCache"
          -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}"
