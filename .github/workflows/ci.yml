name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch/PR at a time: new pushes cancel the superseded run
# instead of stacking runners and racing for the same caches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    env:
      MABIMS_EPHEMERIS_DIR: ${{ github.workspace }}/api/.ephem
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      # de440s.bsp is tracked in git (api/scripts/.ephemeris-cache/), so stage
      # it directly: no JPL download to hang, no cache to miss.
      - name: Stage JPL ephemeris from the tracked copy
        run: |
          set -euo pipefail
          mkdir -p .ephem
          cp scripts/.ephemeris-cache/de440s.bsp .ephem/de440s.bsp
          test -s .ephem/de440s.bsp

      - name: Install package + dev tools
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest -q

      - name: Validate curated table vs Neo MABIMS criteria
        run: python scripts/validate_mabims.py

  # The ONLY deployer. CI must pass (plain needs: gate) — a red commit is a
  # non-deploy, never a broken deploy already shipped by Dokploy in parallel.
  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Worst case: 20m build watch + 6m hash poll + purges + 7.5m hilal verify.
    timeout-minutes: 45
    steps:
      # Dokploy compose deploys can fail while the old container keeps
      # serving — so watch the deployment record itself, not just healthz.
      - name: Record the current live build hash
        run: |
          set -euo pipefail
          BODY=$(curl -sf --max-time 15 "https://api.mabims.dev/healthz" || true)
          OLD=$(printf '%s' "$BODY" | jq -r '.build_hash // "unknown"' 2>/dev/null || echo unknown)
          echo "OLD_BUILD_HASH=$OLD" >> "$GITHUB_ENV"
          echo "pre-deploy build_hash=$OLD"

      - name: Trigger the Dokploy deploy
        run: >
          curl -sS --fail --retry 3 --retry-delay 5 --retry-all-errors
          --connect-timeout 15 --max-time 60 -X POST
          "${{ vars.DOKPLOY_URL }}/api/compose.deploy"
          -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}"
          -H "Content-Type: application/json"
          -d '{"composeId": "${{ vars.DOKPLOY_COMPOSE_ID }}"}'

      - name: Wait for the Dokploy build to finish
        run: |
          set -euo pipefail
          BASE="${{ vars.DOKPLOY_URL }}"
          KEY="${{ secrets.DOKPLOY_API_KEY }}"
          CID="${{ vars.DOKPLOY_COMPOSE_ID }}"
          LIST_URL="$BASE/api/deployment.allByCompose?composeId=$CID"
          # deploymentId and id appear in different Dokploy builds — normalize.
          IDS='[.[] | (.deploymentId // .id // empty)] | join(",")'
          BEFORE=$(curl -sf --max-time 15 -H "x-api-key: $KEY" "$LIST_URL" | jq -r "$IDS" || echo "")
          MAX_ATTEMPTS=40
          for i in $(seq 1 $MAX_ATTEMPTS); do
            sleep 30
            JSON=$(curl -sf --max-time 15 -H "x-api-key: $KEY" "$LIST_URL" || true)
            [ -n "$JSON" ] && [ "$JSON" != "null" ] || continue
            NEW=$(printf '%s' "$JSON" | jq -r --arg b "$BEFORE" \
              '[.[] | select((.deploymentId // .id // "") as $id
                 | ($b | split(",") | index($id)) | not)] | .[0] // empty')
            STATUS=$(printf '%s' "$NEW" | jq -r '.status // "missing"')
            if [ "$STATUS" = "done" ]; then
              echo "Dokploy deployment done: $(printf '%s' "$NEW" | jq -r .title)"
              exit 0
            fi
            if [ "$STATUS" = "error" ]; then
              printf '%s' "$NEW" | jq -r '"buildLink: \(."logPath" // "—")"'
              echo "ERROR: the Dokploy deployment failed — see its logs in the dashboard"
              exit 1
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: deployment status '$STATUS'..."
          done
          echo "ERROR: no terminal deployment status within $((MAX_ATTEMPTS * 30))s"
          exit 1

      - name: Wait for the new build hash to go live
        run: |
          set -euo pipefail
          OLD="$OLD_BUILD_HASH"
          if [ "$OLD" = "unknown" ] || [ "$OLD" = "null" ]; then
            echo "no pre-deploy hash; skipping the hash-diff check"
            exit 0
          fi
          for i in $(seq 1 12); do
            BODY=$(curl -sf --max-time 15 "https://api.mabims.dev/healthz" || true)
            HASH=$(printf '%s' "$BODY" | jq -r '.build_hash // "unknown"')
            if [ "$HASH" != "$OLD" ]; then
              echo "new build live: $HASH"
              exit 0
            fi
            echo "Attempt $i/12: still serving build_hash=$OLD"
            sleep 30
          done
          # A fully cached compose build can legitimately keep the old hash,
          # and restarts preserve it — don't hard-fail, the hilal verify below
          # remains the real health gate.
          echo "WARN: build_hash unchanged after 6m (cached/reused image?)"

      - name: Purge API CDN zone
        run: >
          curl -sS --fail --retry 5 --retry-delay 5 --retry-all-errors
          --connect-timeout 15 --max-time 60 -X POST
          "https://api.bunny.net/pullzone/${{ secrets.BUNNY_API_ZONE_API }}/purgeCache"
          -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}"

      - name: Purge Docs CDN zone
        run: >
          curl -sS --fail --retry 5 --retry-delay 5 --retry-all-errors
          --connect-timeout 15 --max-time 60 -X POST
          "https://api.bunny.net/pullzone/${{ secrets.BUNNY_API_ZONE_DOCS }}/purgeCache"
          -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}"

      # /healthz only proves the container booted. The hilal pipeline
      # (ephemeris + astro cache + site model) is the part that has failed
      # in production while everything else stayed green, so gate the
      # deploy on it. The cb= parameter busts the CDN so we reach origin.
      - name: Verify the live hilal endpoint
        run: |
          # Fresh boots also render/populate caches lazily — 30 x 15s = 450s.
          MAX_ATTEMPTS=30
          for i in $(seq 1 $MAX_ATTEMPTS); do
            CB=$(date +%s)
            BODY=$(curl -sS -w '\n%{http_code}' \
              "https://api.mabims.dev/api/v1/hilal/info?month=9&year=1447&cb=$CB" || true)
            CODE=$(echo "$BODY" | tail -n1)
            if [ "$CODE" = "200" ]; then
              echo "hilal/info healthy: $(echo "$BODY" | head -n1 | head -c 200)"
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE $(echo "$BODY" | head -n1 | head -c 400)"
            sleep 15
          done
          echo "ERROR: /api/v1/hilal/info is not healthy on the live deployment"
          exit 1