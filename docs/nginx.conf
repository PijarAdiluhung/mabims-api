server {
    listen 80;
    server_name _;

    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location = /favicon.ico {
        try_files $uri /favicons/favicon.ico;
    }

    location / {
        add_header Cache-Control "public, max-age=300, s-maxage=300";
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz.txt {
        return 200 "ok";
    }

    # Server-rendered calendar page (docs-ssr container, compose network)
    location ^~ /kalender-hijriah {
        proxy_pass http://docs-ssr:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }
}
