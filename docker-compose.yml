services:
  api:
    build: ./api
    image: mabims-api:latest
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      RATE_LIMIT: ${RATE_LIMIT:-240/minute}
      MABIMS_FALLBACK_DIR: /data
      MABIMS_ASTROCACHE: /data/hilal_astro.sqlite
      # Re-fetch the published sqlite when the local copy is stale (site
      # fingerprint changed, size differs) — no volume reset per update.
      MABIMS_ASTROCACHE_REFRESH: "1"
    volumes:
      - fallback_data:/data
    expose:
      - "8000"

  docs:
    build:
      context: ./docs
      target: static
      args:
        PUBLIC_API_BASE: ${PUBLIC_API_BASE:-https://api.mabims.dev}
    image: mabims-docs:latest
    restart: unless-stopped
    expose:
      - "80"

  # Server-rendered Astro pages (prerender = false) behind nginx.
  docs-ssr:
    build:
      context: ./docs
      target: ssr
      args:
        PUBLIC_API_BASE: ${PUBLIC_API_BASE:-https://api.mabims.dev}
    image: mabims-docs-ssr:latest
    restart: unless-stopped
    environment:
      INTERNAL_API_BASE: ${INTERNAL_API_BASE:-http://api:8000}
    expose:
      - "4321"
    depends_on:
      - api

volumes:
  fallback_data:
